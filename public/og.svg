  <text x="80" y="300" font-family="system-ui, sans-serif" font-size="74" font-weight="700" fill="#ffffff">Turn any live website into</text>
  <text x="80" y="386" font-family="system-ui, sans-serif" font-size="74" font-weight="700" fill="url(#accent)">an AI-ready design prompt</text>
  <text x="80" y="462" font-family="system-ui, sans-serif" font-size="30" fill="#9aa3b2">Extract a site's design language. Hand it to Claude, v0, Lovable, or Bolt.</text>
  <text x="80" y="504" font-family="system-ui, sans-serif" font-size="30" fill="#9aa3b2">Build a near-match. Runs on local models. No cloud API keys.</text>
  <g font-family="system-ui, sans-serif" font-size="22" fill="#e6e8ef">
    <rect x="80" y="540" width="190" height="48" rx="12" fill="#171b27" stroke="#2a3142"/>
    <text x="104" y="570">Chrome extension</text>
    <rect x="286" y="540" width="150" height="48" rx="12" fill="#171b27" stroke="#2a3142"/>
    <text x="310" y="570">Local models</text>
    <rect x="452" y="540" width="150" height="48" rx="12" fill="#171b27" stroke="#2a3142"/>
    <text x="476" y="570">Free + Pro</text>
